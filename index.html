<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style/style.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Press+Start+2P&display=swap" rel="stylesheet">
</head>

<body>
  <div class="content">

    <span class="flex">
      <h1 class="pixelated">Ch4ntal.dev</h1>
      <span class="flex space"></span>
      <img src="./assets/no_ai.png" alt="No AI badge">
    </span>

    <p id="age">21y/o anxious creature</p>
    
    <h2>Cool stuff I made <smol>(and am proud enough of to showcaseof)</smol></h2>
    <!-- Empty icon from Opticon (https://github.com/primer/octicons) -->
    <div class="float">
      <a href="https://github.com/ClementR22/MarioKalc/" target="_blank" class="card">
        <h3 class="card-title"><img src="./assets/mariokalc.svg" class="icon" alt="MarioKalc icon">ClementR22/MarioKalc</h3>
      <p><div class="circle blue"></div>Typescript</p>
    </a>
    <a href="https://github.com/RobotechNancy/Wiki" target="_blank" class="card">
      <h3 class="card-title"><img src="./assets/empty.svg" class="icon" alt="Robotech Wiki icon">RobotechNancy/Wiki</h3>
      <p><div class="circle green"></div>Shell</p>
    </a>
    <a href="https://github.com/NoAccount1/Scitools" target="_blank" class="card">
      <h3 class="card-title"><img src="./assets/Scitool.png" class="icon" alt="Scitools icon">NoAccount1/Scitools</h3>
      <p><div class="circle pink"></div>C++</p>
    </a>
    <a href="https://github.com/NoAccount1/DS4VR" target="_blank" class="card">
      <h3 class="card-title"><img src="./assets/empty.svg" class="icon" alt="DS4VR icon">NoAccount1/DS4VR</h3>
      <p><div class="circle pink"></div>C++</p>
    </a>
  </div>
</div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.js" integrity="sha512-n/4gHW3atM3QqRcbCn6ewmpxcLAHGaDjpEBu4xZd47N0W2oQ+6q7oc3PXstrJYXcbNU1OHdQ1T7pAP+gi5Yu8g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="javascript/script.js"></script>
  <script>
    date = new Date(2005, 2, 9);

    document.getElementById("age").textContent = `${Math.floor((Date.now() - date) / (1000 * 60 * 60 * 24 * 365.25))}y/o anxious creature`;
  </script>
</body>
</html>
